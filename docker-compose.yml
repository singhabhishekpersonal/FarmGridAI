version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: FarmGridAI
      POSTGRES_USER: khetsathi
      POSTGRES_PASSWORD: khetsathi_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: FarmGridAI.settings.development
      DJANGO_DEBUG: "true"
      DB_ENGINE: postgres
      DB_NAME: FarmGridAI
      DB_USER: khetsathi
      DB_PASSWORD: khetsathi_dev
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A FarmGridAI worker -l info
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: FarmGridAI.settings.development
      DB_ENGINE: postgres
      DB_NAME: FarmGridAI
      DB_USER: khetsathi
      DB_PASSWORD: khetsathi_dev
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis

volumes:
  pgdata: