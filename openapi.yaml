openapi: 3.0.3
info:
  title: FarmGrid AI API
  version: 1.0.0
  description: Personalized farm financial intelligence for Indian farmers. All analytical
    outputs are estimates with confidence, assumptions and limitations. Subsidy outputs
    are preliminary and require official verification.
paths:
  /api/v1/auth/consents/:
    get:
      operationId: auth_consents_list
      description: |-
        List the caller's consent records, or grant/revoke one purpose.

        ``purpose`` must be a known entry in ``ConsentRecord.PURPOSES`` or the
        request is rejected with 400. ``granted`` is parsed leniently as
        bool/number/string so a literal ``"false"`` does not register as consent;
        granting stamps the timestamp, version and remote IP.
      summary: List the caller's consent records
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_envelope'
          description: Standard API envelope.
    post:
      operationId: auth_consents_grant
      description: |-
        List the caller's consent records, or grant/revoke one purpose.

        ``purpose`` must be a known entry in ``ConsentRecord.PURPOSES`` or the
        request is rejected with 400. ``granted`` is parsed leniently as
        bool/number/string so a literal ``"false"`` does not register as consent;
        granting stamps the timestamp, version and remote IP.
      summary: Grant or revoke consent for one purpose
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/consent_record_item_envelope'
          description: Standard API envelope.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
          description: Invalid consent purpose.
  /api/v1/auth/language/:
    get:
      operationId: auth_language_list
      description: |-
        List language preferences, or set the caller's active language.

        Only 'en' and 'hi' are accepted (400 otherwise); the choice is written both
        to ``user.preferred_language``, which is what the rest of the app reads, and
        as a primary UserLanguagePreference row.
      summary: List the caller's language preferences
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_envelope'
          description: Standard API envelope.
    post:
      operationId: auth_language_set
      description: |-
        List language preferences, or set the caller's active language.

        Only 'en' and 'hi' are accepted (400 otherwise); the choice is written both
        to ``user.preferred_language``, which is what the rest of the app reads, and
        as a primary UserLanguagePreference row.
      summary: Set the caller's active language
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguagePreferenceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LanguagePreferenceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LanguagePreferenceRequestRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_language_preference_item_envelope'
          description: Standard API envelope.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
          description: Unsupported language.
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: |-
        Exchange credentials for a JWT pair and start a Django session.

        The session is not a convenience: the SPA pages gate on Django session auth,
        which a bearer token alone cannot satisfy. Rate limited to 20/hour per
        anonymous client, shared with the refresh endpoint.
      summary: Obtain JWT pair and start a Django session
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token_pair_envelope'
          description: Standard API envelope.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
          description: Invalid credentials.
  /api/v1/auth/login/refresh/:
    post:
      operationId: auth_token_refresh
      description: |-
        Exchange a refresh token for a new access token.

        SIMPLE_JWT sets ROTATE_REFRESH_TOKENS = True, so a rotated refresh token is
        returned when rotation happens and the client must replace its stored one.
        Keeping the standard {success, data: {access, refresh?}} envelope means the
        web client's api layer can treat login and refresh identically.
      summary: Exchange a refresh token for a new access token
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token_pair_envelope'
          description: Standard API envelope.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
          description: Session expired.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: |-
        Close the Django session opened at login.

        Server-side this only invalidates the session cookie; the JWTs are stateless
        and must be discarded by the client, so the response is advisory rather than
        a true revocation.
      summary: Close the Django session and discard tokens
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logout_envelope'
          description: Standard API envelope.
  /api/v1/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: |-
        Read or partially update the caller's own farmer profile.

        A missing profile is created lazily on first access, which is what keeps
        superuser and ORM-created accounts from 500ing here. PATCH is partial and
        stamps ``updated_by`` with the caller.
      summary: Retrieve the farmer profile
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/farmer_profile_item_envelope'
          description: Standard API envelope.
    patch:
      operationId: auth_profile_partial_update
      description: |-
        Read or partially update the caller's own farmer profile.

        A missing profile is created lazily on first access, which is what keeps
        superuser and ORM-created accounts from 500ing here. PATCH is partial and
        stamps ``updated_by`` with the caller.
      summary: Partially update the farmer profile
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFarmerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFarmerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFarmerProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/farmer_profile_item_envelope'
          description: Standard API envelope.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
          description: Validation failed.
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      description: |-
        Create a user and farmer profile, and return the first JWT pair.

        Atomic: the user, profile and a pre-seeded ungranted profile-purpose consent
        are written together. Password rules are Django's ``validate_password``
        (minimum length 8), and the response also opens a Django session so the
        server-rendered pages are reachable. Anonymous-only, capped at 10/hour.
      summary: Register a new farmer
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_envelope'
          description: Standard API envelope.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
          description: Validation failed.
  /api/v1/bigha-rules:
    get:
      operationId: v1_bigha_rules_retrieve
      description: |-
        Verified bigha-to-hectare conversion rules, optionally by state.

        Only ``is_verified`` rows are exposed so unverified seed data never reaches
        the client; the optional ``state`` filter is case-insensitive.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/chat/sessions:
    post:
      operationId: v1_chat_sessions_create
      description: |-
        Open a chat session, optionally scoped to one of the caller's farms.

        The farm is resolved by ownership rather than trusted from the payload, and
        an unknown farm id is reported as a 404 error envelope.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/chat/sessions/{session_id}/ask:
    post:
      operationId: v1_chat_sessions_ask_create
      description: |-
        Ask one question inside a session the caller owns.

        Retrieval is keyword-based over the knowledge base and no LLM is called; the
        question and the reply are both persisted as chat messages, and unmatched
        questions come back flagged as fallbacks needing a human.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/chat/sessions/{session_id}/messages:
    get:
      operationId: v1_chat_sessions_messages_retrieve
      description: |-
        The stored message transcript of a session, oldest first.

        Sessions belonging to another user are indistinguishable from missing ones,
        both returning a 404 error envelope.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/crops:
    get:
      operationId: v1_crops_retrieve
      description: |-
        The reference crop catalog, searchable by name.

        Only active crops are listed; ``search`` is a case-insensitive substring
        match on the crop name.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/artifacts:
    get:
      operationId: v1_data_ingestion_artifacts_list
      description: |-
        List recently collected artifacts across all sources, newest first.

        Read-only, capped at 100 rows.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/artifacts/{artifact_id}:
    get:
      operationId: v1_data_ingestion_artifacts_retrieve
      description: |-
        Retrieve one collected artifact together with its provenance chain.

        Provenance is computed per request, not cached on the row.
      parameters:
      - in: path
        name: artifact_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/dataset-report:
    get:
      operationId: v1_data_ingestion_dataset_report_retrieve
      description: |-
        Report the dataset expansion plan alongside the eligible-record count.

        Read-only and recomputed per request. The optional known_counts query param
        is a JSON object of existing class counts; malformed JSON returns an error.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/manual-import:
    post:
      operationId: v1_data_ingestion_manual_import_create
      description: |-
        Ingest image files from a server-side folder for a manual_import source.

        Staff/admin only. Refuses non-manual_import or unapproved sources, rejects
        paths that are missing/empty or hold more than 5000 files, and always runs
        for real (no dry-run option). Results land in the review queue.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/provenance-report:
    get:
      operationId: v1_data_ingestion_provenance_report_retrieve
      description: |-
        Report the provenance chain for a source, extracted record or artifact.

        Read-only. Exactly one of source_id, record_id or artifact_id selects the
        subject, checked in that order; supplying none returns an error.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/records:
    get:
      operationId: v1_data_ingestion_records_list
      description: |-
        List extracted records, optionally filtered by record_type and status.

        Read-only, capped at 100 rows.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/records/{record_id}:
    get:
      operationId: v1_data_ingestion_records_retrieve
      description: |-
        Retrieve one extracted record together with its provenance chain.

        Provenance is recomputed on every request, not cached.
      parameters:
      - in: path
        name: record_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/review-queue:
    get:
      operationId: v1_data_ingestion_review_queue_retrieve
      description: |-
        List human-review queue items, optionally filtered by decision and risk.

        Read-only, capped at 100 rows.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/review-queue/{queue_id}/approve:
    post:
      operationId: v1_data_ingestion_review_queue_approve_create
      description: |-
        Record an APPROVED decision on a queue item.

        Overwrites any earlier decision; the linked record's status is left alone
        since only REJECTED propagates to it.
      parameters:
      - in: path
        name: queue_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/review-queue/{queue_id}/publish:
    post:
      operationId: v1_data_ingestion_review_queue_publish_create
      description: |-
        Publish an already-approved queue item into its target live model.

        Second half of the two-step human gate: it never self-approves, so an item
        without a human APPROVED decision, or one that failed validation, is
        rejected with a response error instead of a 500.
      parameters:
      - in: path
        name: queue_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/review-queue/{queue_id}/reject:
    post:
      operationId: v1_data_ingestion_review_queue_reject_create
      description: |-
        Record a REJECTED decision on a queue item.

        Unlike approval, this also flips the linked extracted record to REJECTED
        and stamps the reviewing user, notes and timestamp on it.
      parameters:
      - in: path
        name: queue_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/runs:
    get:
      operationId: v1_data_ingestion_runs_list
      description: |-
        List recent ingestion runs across all sources, newest first.

        Read-only, capped at 100 rows.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/runs/{run_id}:
    get:
      operationId: v1_data_ingestion_runs_retrieve
      description: |-
        Retrieve a single ingestion run by id.

        Read-only; an unknown id returns 404 rather than raising.
      parameters:
      - in: path
        name: run_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/sources:
    get:
      operationId: v1_data_ingestion_sources_list
      description: |-
        List registered data sources, or register a new one.

        GET filters by name/category/approval_status and is open to any
        authenticated user. POST is staff/admin only and always creates the source in
        the pending state, so collection stays disabled until it is approved.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_data_ingestion_sources_create
      description: |-
        List registered data sources, or register a new one.

        GET filters by name/category/approval_status and is open to any
        authenticated user. POST is staff/admin only and always creates the source in
        the pending state, so collection stays disabled until it is approved.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/sources/{source_id}:
    get:
      operationId: v1_data_ingestion_sources_retrieve
      description: |-
        Retrieve or partially update a single registered source.

        Reads are open to any authenticated user; PATCH is staff/admin only and
        silently ignores fields outside a fixed editable set. An unknown id returns
        404 rather than raising.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_data_ingestion_sources_partial_update
      description: |-
        Retrieve or partially update a single registered source.

        Reads are open to any authenticated user; PATCH is staff/admin only and
        silently ignores fields outside a fixed editable set. An unknown id returns
        404 rather than raising.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/sources/{source_id}/collect:
    post:
      operationId: v1_data_ingestion_sources_collect_create
      description: |-
        Collect images for a source from an explicit list of URLs.

        Staff/admin only. Defaults to a dry run; execute=true is required for real
        collection and is rejected unless the source is approved and collection
        enabled. Creates an IngestionRun and returns the collector report.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/sources/{source_id}/compliance-check:
    post:
      operationId: v1_data_ingestion_sources_compliance_check_create
      description: |-
        Run a robots/terms compliance decision against a source.

        Staff/admin only. Recomputed on every call and not persisted as a decision
        state on the source; an optional run_id links the check to an ingestion run.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/data-ingestion/sources/{source_id}/runs:
    get:
      operationId: v1_data_ingestion_sources_runs_retrieve
      description: |-
        List the most recent ingestion runs for one source, newest first.

        Capped at 50 rows and read-only for any authenticated user.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/energy/diesel-price-benchmarks:
    get:
      operationId: v1_energy_diesel_price_benchmarks_retrieve
      description: |-
        Verified diesel price benchmarks.

        Filtered to is_verified rows and capped at 50, so this is a sample rather
        than the full table; it takes no farm_id and reads no farm data.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/energy/tariff-benchmarks:
    get:
      operationId: v1_energy_tariff_benchmarks_retrieve
      description: |-
        Published electricity tariff benchmarks, optionally filtered by state.

        Only rows flagged is_verified are returned. The state filter is
        case-insensitive and omitted entirely when absent, so the whole verified
        table is returned uncapped.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/equipment/catalog:
    get:
      operationId: v1_equipment_catalog_retrieve
      description: |-
        Browse verified catalog models, optionally filtered by brand or category.

        Unverified entries are never exposed. ``brand`` matches case-insensitively
        anywhere in the name, ``category`` matches the category code exactly, and
        the result is hard-capped at 200 rows since there is no pagination.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/equipment/categories:
    get:
      operationId: v1_equipment_categories_retrieve
      description: |-
        List every equipment category, unfiltered.

        The category set is small and shared reference data, so no farm scoping or
        query parameters apply despite the ``farm_id`` URL segment.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/:
    get:
