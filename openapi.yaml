              $ref: '#/components/schemas/RentalExpenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RentalExpenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RentalExpenseRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalExpense'
          description: ''
  /api/v1/farms/{farm_id}/expenses/summary:
    get:
      operationId: v1_farms_expenses_summary_retrieve
      description: |-
        Totals and per-category breakdown for a farm's expenses.

        Recomputed on every request by ExpenseAggregationService from the base
        expense rows plus their typed subclasses; nothing is cached or persisted
        here. An optional year query param narrows the window, otherwise all
        recorded years are summarised.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/expenses/transport:
    get:
      operationId: v1_farms_expenses_transport_retrieve
      description: |-
        List and create transport entries.

        Stores vehicle_type and distance_km with the amount; no aggregation or
        per-vehicle grouping is applied on read.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportExpense'
          description: ''
    post:
      operationId: v1_farms_expenses_transport_create
      description: |-
        List and create transport entries.

        Stores vehicle_type and distance_km with the amount; no aggregation or
        per-vehicle grouping is applied on read.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransportExpenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransportExpenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransportExpenseRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportExpense'
          description: ''
  /api/v1/farms/{farm_id}/finance/affordability:
    post:
      operationId: v1_farms_finance_affordability_create
      description: |-
        Scores proposed and existing EMIs as a percentage of annual farm income.

        Write-only POST. Burden above the safe percentage raises the risk level;
        the assessment is saved as an AffordabilityAssessment row. This is an
        estimate, not a lending decision.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/finance/buy-vs-rent:
    post:
      operationId: v1_farms_finance_buy_vs_rent_create
      description: |-
        Compares annual ownership cost against rental cost for a machine.

        Write-only POST. The result, including the loan EMI worked out from the
        supplied subsidy, tenure and interest rate, is persisted as a
        BuyRentAnalysis row and returned with its new analysis_id.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/finance/machinery-decision:
    post:
      operationId: v1_farms_finance_machinery_decision_create
      description: |-
        Runs the rule-first machinery decision engine over farmer-supplied inputs.

        Write-only POST. Unlike the other calculators this view has no input
        serializer: every field is read loosely and falls back to a default, so
        missing usage hours or purchase price yield 'gather_more_information'.
        The scenario is saved as a MachineryPurchaseScenario row.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/finance/repair-vs-replace:
    post:
      operationId: v1_farms_finance_repair_vs_replace_create
      description: |-
        Decides whether repairing an existing machine beats replacing it.

        Write-only POST. Remaining life is inferred from usage hours and repair
        frequency; the outcome is stored as a RepairReplaceAnalysis row and
        returned with its analysis_id.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/finance/scenarios:
    get:
      operationId: v1_farms_finance_scenarios_retrieve
      description: |-
        Read-only list of stored machinery scenarios, newest first.

        Capped at the 20 most recent scenarios for the farm; nothing is written
        and no filtering or pagination is exposed.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/income-profile:
    get:
      operationId: v1_farms_income_profile_retrieve
      description: |-
        Reads or records the farm's income profile used for affordability checks.

        GET returns only the most recent year's profile (null data when none saved);
        POST always inserts a new row, so repeated posts build a per-year history.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_farms_income_profile_create
      description: |-
        Reads or records the farm's income profile used for affordability checks.

        GET returns only the most recent year's profile (null data when none saved);
        POST always inserts a new row, so repeated posts build a per-year history.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/land-parcels:
    get:
      operationId: v1_farms_land_parcels_retrieve
      description: |-
        The land parcels belonging to one farm, and parcel creation.

        Parcels are always created against the farm resolved from the URL rather
        than a farm id in the payload, so a farm cannot be written across.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_farms_land_parcels_create
      description: |-
        The land parcels belonging to one farm, and parcel creation.

        Parcels are always created against the farm resolved from the URL rather
        than a farm id in the payload, so a farm cannot be written across.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/opportunities:
    get:
      operationId: v1_farms_opportunities_retrieve
      description: |-
        Read-only list of cost-saving opportunities recorded for the farm.

        Unpaginated and unordered beyond the model's default newest-first
        ordering; rows are written elsewhere, not here.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/pump-profile:
    get:
      operationId: v1_farms_pump_profile_retrieve
      description: |-
        Read and save the farm's pump profile.

        GET returns the most recently created profile, the same row
        EnergyAnalysisService resolves as current, or a null data payload when
        none is saved yet. POST appends a new profile rather than updating in
        place, so history is kept.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_farms_pump_profile_create
      description: |-
        Read and save the farm's pump profile.

        GET returns the most recently created profile, the same row
        EnergyAnalysisService resolves as current, or a null data payload when
        none is saved yet. POST appends a new profile rather than updating in
        place, so history is kept.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/recommendation-runs:
    get:
      operationId: v1_farms_recommendation_runs_retrieve
      description: |-
        Read-only list of recommendation runs for the farm.

        Serialized with .values() rather than a model serializer, so it returns raw
        model columns including audit fields; no cap or pagination is applied.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/recommendations:
    get:
      operationId: v1_farms_recommendations_retrieve
      description: |-
        Read-only list of every stored recommendation for the farm.

        Returns every row regardless of run, priority or category, so successive
        generate calls accumulate history rather than replacing it.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/recommendations/{recommendation_id}/explain:
    get:
      operationId: v1_farms_recommendations_explain_retrieve
      description: |-
        Builds the explanation object for one recommendation (evidence, assumptions, uncertainty).

        Read-only and scoped to the farm, so another farm's id returns a 404 error
        envelope rather than an exception. Nothing is persisted.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: recommendation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/recommendations/{recommendation_id}/feedback:
    post:
      operationId: v1_farms_recommendations_feedback_create
      description: |-
        Records a farmer's helpful/accurate flags, rating and comment on a recommendation.

        POST only, and appends rather than updating: each call creates a new
        feedback row. Request data is read without a serializer, so missing fields
        fall back to defaults and rating is stored unchecked. An unknown or
        foreign recommendation returns a 404 error envelope.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: recommendation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/recommendations/run:
    post:
      operationId: v1_farms_recommendations_run_create
      description: |-
        Runs the recommendation engine synchronously and persists the results.

        POST only. Each call writes a RecommendationRun plus one Recommendation
        with its evidence and assumption rows; prior runs are left intact.
        Set use_ml_ranker false to skip ML ranking and use the deterministic
        priority score. Evidence gathering is best-effort, so missing source
        data yields fewer recommendations rather than an error.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/solar-configuration:
    get:
      operationId: v1_farms_solar_configuration_retrieve
      description: |-
        Read and save the farm's solar system configuration.

        GET returns the newest configuration, matching the row the analysis
        service uses, and returns a null payload when none exists. POST inserts a
        new row each time, so the latest save is the effective one.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_farms_solar_configuration_create
      description: |-
        Read and save the farm's solar system configuration.

        GET returns the newest configuration, matching the row the analysis
        service uses, and returns a null payload when none exists. POST inserts a
        new row each time, so the latest save is the effective one.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/subsidies/checklists:
    get:
      operationId: v1_farms_subsidies_checklists_retrieve
      description: |-
        Flattened document checklists for every matched scheme on a farm.

        Each row is prefixed with its ``match_id`` and scheme name so the client
        can group documents without a second request.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/subsidies/match:
    post:
      operationId: v1_farms_subsidies_match_create
      description: |-
        Run the eligibility engine against one farm and persist the matches.

        This is a write: ``run_match`` upserts ``FarmerSchemeMatch`` rows, which
        the recommendations and checklist views then read back.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/subsidies/recommendations:
    get:
      operationId: v1_farms_subsidies_recommendations_retrieve
      description: |-
        Schemes previously matched to this farm, with match reasons.

        Reads the stored matches instead of re-running the engine, so it is empty
        until ``SubsidyMatchView`` has been called for the farm.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/farms/{farm_id}/summary:
    get:
      operationId: v1_farms_summary_retrieve
      description: |-
        Rolled-up view of one farm: parcel count, totals and location.

        Hectares are summed from the parcels and echoed in acres, and parcels still
        flagged ``area_requires_confirmation`` are listed by id.
      parameters:
      - in: path
        name: farm_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/land-units/convert:
    post:
      operationId: v1_land_units_convert_create
      description: 'Convert land area: POST /api/v1/land-units/convert/'
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/subsidies:
    get:
      operationId: v1_subsidies_list
      description: |-
        Browse active subsidy schemes, filterable by category and state.

        Only ``is_active`` schemes are listed; eligibility is not evaluated here.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/subsidies/{scheme_id}:
    get:
      operationId: v1_subsidies_retrieve
      description: |-
        Full record for a single scheme, including inactive ones.

        A missing id is reported as a 404 error envelope rather than raised.
      parameters:
      - in: path
        name: scheme_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/system/capabilities:
    get:
      operationId: v1_system_capabilities_retrieve
      description: |-
        Stable, public descriptor of what the platform can do.

        Contains no secrets, paths, hostnames or per-farmer data. Reported model
        information is derived from settings defaults (the classifier only runs
        when an artifact is present) and is deliberately conservative.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/system/data-source-status:
    get:
      operationId: v1_system_data_source_status_retrieve
      description: Safe aggregate of ingestion-source approval state (no URLs or notes).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/system/model-status:
    get:
      operationId: v1_system_model_status_retrieve
      description: Safe aggregate over the ML model registry (no artifact paths/weights).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    ApiErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          description: Always false.
        message:
          type: string
          description: Human readable summary of the failure.
        data:
          type: object
          additionalProperties: {}
          nullable: true
        errors:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - message
      - success
    ConsentRequestRequest:
      type: object
      properties:
        purpose:
          type: string
          minLength: 1
          description: One of the entries in ConsentRecord.PURPOSES.
        granted:
          type: boolean
          default: true
        version:
          type: string
      required:
      - purpose
    ElectricityBill:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_on:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        provider:
          type: string
          maxLength: 80
        units_kwh:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        bill_month:
          type: string
          format: date
          nullable: true
        tariff_effective_per_kwh:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        note:
          type: string
      required:
      - amount
      - id
      - occurred_on
      - tariff_effective_per_kwh
    ElectricityBillRequest:
      type: object
      properties:
        occurred_on:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        provider:
          type: string
          maxLength: 80
        units_kwh:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        bill_month:
          type: string
          format: date
          nullable: true
        note:
          type: string
      required:
      - amount
      - occurred_on
    FarmExpense:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        occurred_on:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        category:
          type: string
          format: uuid
          nullable: true
        expense_type:
          type: string
          maxLength: 30
        note:
          type: string
        year:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - occurred_on
      - year
    FarmExpenseRequest:
      type: object
      properties:
        occurred_on:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        category:
          type: string
          format: uuid
          nullable: true
        expense_type:
          type: string
          minLength: 1
          maxLength: 30
        note:
          type: string
      required:
      - amount
      - occurred_on
    FarmerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        full_name:
          type: string
          maxLength: 120
        phone:
          oneOf:
          - type: string
            pattern: ^[0-9]{10}$
            maxLength: 15
          - type: string
            maxLength: 0
        gender:
          $ref: '#/components/schemas/GenderEnum'
        state:
          type: string
          maxLength: 60
        district:
          type: string
          maxLength: 60
        village:
          type: string
          maxLength: 80
        pincode:
          type: string
          maxLength: 6
        land_size:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          nullable: true
        land_unit:
          $ref: '#/components/schemas/LandUnitEnum'
        normalized_land_hectares:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
